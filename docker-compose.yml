services:
  backend:
    container_name: genially-to-pdf-backend
    build: ./
    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "53714:8000"
    env_file:
      - .env
    volumes:
      - genially-to-pdf-database:/app/database

    restart: unless-stopped

volumes:
  genially-to-pdf-database:
    external: false
