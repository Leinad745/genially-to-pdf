services:
  backend:
    container_name: genially-to-pdf-backend
    image: leon135/genially-to-pdf-backend
    build: ./
    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1g
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "53714:8000"
    env_file:
      - .env
    volumes:
      - genially-to-pdf-backend-database:/app/database

    restart: unless-stopped

volumes:
  genially-to-pdf-backend-database:
    name: genially-to-pdf-backend-database
    external: false
